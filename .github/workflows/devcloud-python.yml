name: DevCloud Python

on:
  push:
    branches: [main, dev]
    paths:
      - 'tests/test_*.py'
      - 'bin/devcloud*'
      - '.claude/skills/devcloud-*/**'
      - 'docs/DEVCLOUD_*'
      - '.github/workflows/devcloud-python.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'tests/test_*.py'
      - 'bin/devcloud*'
      - '.claude/skills/devcloud-*/**'
      - 'docs/DEVCLOUD_*'
      - '.github/workflows/devcloud-python.yml'

permissions:
  contents: read

jobs:
  devcloud-pytest:
    name: DevCloud pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Run DevCloud suite
        env:
          MOLE_DEVCLOUD_SITE: ${{ github.workspace }}/devcloud.example.gitconfig
        run: python -m pytest -q -r s tests/test_devcloud*.py tests/test_git_tree_sweep.py tests/test_patrol*.py
